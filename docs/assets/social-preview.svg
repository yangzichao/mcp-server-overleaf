<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Overleaf MCP Server</title>
  <desc id="description">Safe AI-assisted LaTeX editing for Claude, Codex, ChatGPT, and Cursor.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A" />
      <stop offset="1" stop-color="#1E293B" />
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#94A3B8" stroke-opacity="0.08" />
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="1280" height="640" rx="32" fill="url(#background)" />
  <rect width="1280" height="640" rx="32" fill="url(#grid)" />
  <circle cx="1210" cy="-24" r="280" fill="#10B981" opacity="0.08" />
  <circle cx="1120" cy="700" r="330" fill="#38BDF8" opacity="0.06" />

  <g transform="translate(92 112)" filter="url(#shadow)">
    <rect width="344" height="416" rx="72" fill="#1F2937" stroke="#334155" stroke-width="2" />
    <path d="M94 78h112l58 58v202a28 28 0 0 1-28 28H94a28 28 0 0 1-28-28V106a28 28 0 0 1 28-28Z" fill="#F8FAFC" />
    <path d="M206 78v58h58Z" fill="#CBD5E1" />
    <rect x="102" y="164" width="112" height="18" rx="9" fill="#10B981" />
    <rect x="102" y="218" width="138" height="14" rx="7" fill="#94A3B8" />
    <rect x="102" y="258" width="138" height="14" rx="7" fill="#94A3B8" />
    <rect x="102" y="298" width="96" height="14" rx="7" fill="#94A3B8" />
  </g>

  <g transform="translate(500 116)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="0" y="42" fill="#34D399" font-size="30" font-weight="700" letter-spacing="4">OVERLEAF MCP SERVER</text>
    <text x="0" y="128" fill="#F8FAFC" font-size="62" font-weight="760">Write papers with AI.</text>
    <text x="0" y="202" fill="#F8FAFC" font-size="62" font-weight="760">Keep collaborators safe.</text>
    <text x="0" y="272" fill="#CBD5E1" font-size="28">Read · edit · compile · review · sync</text>

    <g transform="translate(0 326)" font-size="22" font-weight="650">
      <rect width="138" height="50" rx="25" fill="#334155" />
      <text x="69" y="33" text-anchor="middle" fill="#F8FAFC">Claude</text>
      <rect x="152" width="124" height="50" rx="25" fill="#334155" />
      <text x="214" y="33" text-anchor="middle" fill="#F8FAFC">Codex</text>
      <rect x="290" width="144" height="50" rx="25" fill="#334155" />
      <text x="362" y="33" text-anchor="middle" fill="#F8FAFC">ChatGPT</text>
      <rect x="448" width="126" height="50" rx="25" fill="#334155" />
      <text x="511" y="33" text-anchor="middle" fill="#F8FAFC">Cursor</text>
    </g>

    <text x="0" y="444" fill="#94A3B8" font-size="24">github.com/yangzichao/mcp-server-overleaf</text>
  </g>
</svg>
