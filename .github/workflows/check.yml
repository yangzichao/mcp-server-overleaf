name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 24]
    env:
      OVERLEAF_TEST_TEX: skip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check

  tex:
    name: TeX integration and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OVERLEAF_TEST_TEX: required
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-base
      - run: npm ci
      - run: npm run test:coverage
