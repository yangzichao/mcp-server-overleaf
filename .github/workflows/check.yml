name: Check

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  core:
    name: Core / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    # macOS runners vary: the same suite took 7 minutes on one and ran past 15 on another.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22.14.0, 24, 26]
    env:
      OVERLEAF_TEST_TEX: skip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - if: matrix.node == 24 && matrix.os == 'macos-latest'
        run: npm run package:check

  static:
    name: Static analysis / Linux / Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:regex
      # actionlint checks the workflows, and the shell in their run steps with the runner's shellcheck.
      - name: Lint the workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  tex:
    name: TeX and release artifact / Linux / Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OVERLEAF_TEST_TEX: required
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.21.0 --ignore-scripts
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-base
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run package:check
      - run: npm run mcpb:build
      - run: npm run registry:build
      - run: npm run audit:dependencies
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release-candidate
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claude-desktop-bundle
          path: build/mcpb/*.mcpb
          if-no-files-found: error
          retention-days: 14
